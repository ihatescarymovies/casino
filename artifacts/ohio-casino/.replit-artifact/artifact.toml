kind = "web"
previewPath = "/"
title = "Ohio Casino"
version = "1.0.0"
id = "artifacts/ohio-casino"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19259

[services.development]
run = "pnpm --filter @workspace/ohio-casino run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ohio-casino", "run", "build" ]
publicDir = "artifacts/ohio-casino/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19259"
BASE_PATH = "/"
