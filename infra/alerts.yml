groups:
  - name: casino-api
    rules:
      - alert: HighPaymentFailureRate
        expr: |
          sum(rate(payment_creations_total{status="failed"}[5m]))
          /
          clamp_min(sum(rate(payment_creations_total[5m])), 1)
          > 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Payment failure rate above 15%"
          description: "Checkout failures exceed 15% over the last 10 minutes."

      - alert: HighWebhookFailureRate
        expr: |
          sum(rate(webhook_deliveries_total{result="failed"}[5m]))
          /
          clamp_min(sum(rate(webhook_deliveries_total[5m])), 1)
          > 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Webhook failure rate above 10%"
          description: "PayRam webhook processing failures exceed 10% over 10 minutes."

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (le, route)
          ) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "P95 latency above 2 seconds"
          description: "95th percentile request latency exceeds 2s on one or more routes."

      - alert: ServiceDown
        expr: up{job="casino-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Casino API server is down"
          description: "Prometheus cannot reach the casino-api target."
